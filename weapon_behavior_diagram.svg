<svg width="800" height="780" viewBox="0 0 800 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="tri" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="white" stroke="black" stroke-width="1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="780" fill="#ffffff"/>

  <!-- Character -->
  <rect x="290" y="20" width="220" height="130" fill="white" stroke="black" stroke-width="1"/>
  <line x1="290" y1="50" x2="510" y2="50" stroke="black" stroke-width="1"/>
  <text x="400" y="40" text-anchor="middle" font-size="15" font-weight="bold">Character</text>
  <text x="300" y="70" font-size="12">WeaponBehavior weapon;</text>
  <text x="300" y="98" font-size="12">fight();</text>
  <text x="300" y="122" font-size="11">setWeapon(WeaponBehavior w);</text>

  <!-- Note: SetWeapon implementation -->
  <rect x="560" y="20" width="210" height="100" fill="white" stroke="black" stroke-width="1"/>
  <line x1="560" y1="50" x2="770" y2="50" stroke="black" stroke-width="1"/>
  <text x="665" y="40" text-anchor="middle" font-size="12" font-weight="bold">Character::setWeapon</text>
  <text x="570" y="68" font-size="12">{</text>
  <text x="580" y="88" font-size="11">this.weapon = w;</text>
  <text x="570" y="108" font-size="12">}</text>
  <line x1="510" y1="85" x2="560" y2="70" stroke="#666666" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Subclasses -->
  <rect x="25" y="210" width="170" height="70" fill="white" stroke="black" stroke-width="1"/>
  <line x1="25" y1="238" x2="195" y2="238" stroke="black" stroke-width="1"/>
  <text x="110" y="228" text-anchor="middle" font-size="14" font-weight="bold">Queen</text>
  <text x="35" y="258" font-size="12">fight();</text>

  <rect x="218" y="210" width="170" height="70" fill="white" stroke="black" stroke-width="1"/>
  <line x1="218" y1="238" x2="388" y2="238" stroke="black" stroke-width="1"/>
  <text x="303" y="228" text-anchor="middle" font-size="14" font-weight="bold">King</text>
  <text x="228" y="258" font-size="12">fight();</text>

  <rect x="411" y="210" width="170" height="70" fill="white" stroke="black" stroke-width="1"/>
  <line x1="411" y1="238" x2="581" y2="238" stroke="black" stroke-width="1"/>
  <text x="496" y="228" text-anchor="middle" font-size="14" font-weight="bold">Troll</text>
  <text x="421" y="258" font-size="12">fight();</text>

  <rect x="604" y="210" width="170" height="70" fill="white" stroke="black" stroke-width="1"/>
  <line x1="604" y1="238" x2="774" y2="238" stroke="black" stroke-width="1"/>
  <text x="689" y="228" text-anchor="middle" font-size="14" font-weight="bold">Knight</text>
  <text x="614" y="258" font-size="12">fight();</text>

  <!-- IS-A arrows -->
  <line x1="110" y1="210" x2="400" y2="151" stroke="black" stroke-width="1" marker-end="url(#tri)"/>
  <line x1="303" y1="210" x2="400" y2="151" stroke="black" stroke-width="1" marker-end="url(#tri)"/>
  <line x1="496" y1="210" x2="400" y2="151" stroke="black" stroke-width="1" marker-end="url(#tri)"/>
  <line x1="689" y1="210" x2="400" y2="151" stroke="black" stroke-width="1" marker-end="url(#tri)"/>

  <!-- HAS-A arrow -->
  <line x1="400" y1="150" x2="400" y2="339" stroke="black" stroke-width="1" marker-end="url(#tri)"/>

  <!-- WeaponBehavior interface -->
  <rect x="290" y="340" width="220" height="90" fill="white" stroke="black" stroke-width="1"/>
  <line x1="290" y1="384" x2="510" y2="384" stroke="black" stroke-width="1"/>
  <text x="400" y="358" text-anchor="middle" font-size="11" font-style="italic">&#171;interface&#187;</text>
  <text x="400" y="375" text-anchor="middle" font-size="14" font-weight="bold">WeaponBehavior</text>
  <text x="300" y="404" font-size="12">UseWeapon()</text>

  <!-- Behavior classes -->
  <rect x="25" y="470" width="170" height="140" fill="white" stroke="black" stroke-width="1"/>
  <line x1="25" y1="496" x2="195" y2="496" stroke="black" stroke-width="1"/>
  <text x="110" y="488" text-anchor="middle" font-size="13" font-weight="bold">KnifeBehavior</text>
  <text x="33" y="514" font-size="10">+ UseWeapon() { //</text>
  <text x="33" y="530" font-size="10">Implements cutting</text>
  <text x="33" y="546" font-size="10">with a knife }</text>

  <rect x="218" y="470" width="170" height="140" fill="white" stroke="black" stroke-width="1"/>
  <line x1="218" y1="496" x2="388" y2="496" stroke="black" stroke-width="1"/>
  <text x="303" y="488" text-anchor="middle" font-size="11" font-weight="bold">BowAndArrowBehavior</text>
  <text x="226" y="514" font-size="10">+ UseWeapon() { //</text>
  <text x="226" y="530" font-size="10">Implements shooting</text>
  <text x="226" y="546" font-size="10">an arrow w/ bow }</text>

  <rect x="411" y="470" width="170" height="140" fill="white" stroke="black" stroke-width="1"/>
  <line x1="411" y1="496" x2="581" y2="496" stroke="black" stroke-width="1"/>
  <text x="496" y="488" text-anchor="middle" font-size="13" font-weight="bold">SwordBehavior</text>
  <text x="419" y="514" font-size="10">+ UseWeapon() { //</text>
  <text x="419" y="530" font-size="10">Implements swinging</text>
  <text x="419" y="546" font-size="10">a sword }</text>

  <rect x="604" y="470" width="170" height="140" fill="white" stroke="black" stroke-width="1"/>
  <line x1="604" y1="496" x2="774" y2="496" stroke="black" stroke-width="1"/>
  <text x="689" y="488" text-anchor="middle" font-size="13" font-weight="bold">AxeBehavior</text>
  <text x="612" y="514" font-size="10">+ UseWeapon() { //</text>
  <text x="612" y="530" font-size="10">Implements chopping</text>
  <text x="612" y="546" font-size="10">with an axe }</text>

  <!-- IMPLEMENTS arrows (dashed) -->
  <line x1="110" y1="470" x2="400" y2="431" stroke="black" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#tri)"/>
  <line x1="303" y1="470" x2="400" y2="431" stroke="black" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#tri)"/>
  <line x1="496" y1="470" x2="400" y2="431" stroke="black" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#tri)"/>
  <line x1="689" y1="470" x2="400" y2="431" stroke="black" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#tri)"/>

  <!-- Legend -->
  <line x1="310" y1="670" x2="370" y2="670" stroke="black" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#tri)"/>
  <text x="380" y="674" font-size="12">IMPLEMENTS</text>

  <line x1="310" y1="705" x2="370" y2="705" stroke="black" stroke-width="1" marker-end="url(#tri)"/>
  <text x="380" y="709" font-size="12">IS-A</text>

  <line x1="310" y1="740" x2="370" y2="740" stroke="black" stroke-width="1" marker-end="url(#tri)"/>
  <text x="380" y="744" font-size="12">HAS-A</text>
</svg>
